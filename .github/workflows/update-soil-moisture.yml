name: Update CoAgMET Soil Moisture Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Fetch soil moisture data (hourly, aggregated to daily)
        run: python3 .github/scripts/fetch_coagmet_soilmoisture.py

      - name: Fetch station metadata
        run: |
          curl -sf "https://coagmet.colostate.edu/data/metadata.json" \
            -o soil/coagmet-metadata.json

      - name: Fetch CoAgMET daily data (precip, etc.)
        run: python3 .github/scripts/fetch_coagmet_daily.py

      - name: Fetch RAWS live snapshot (soil moisture + recent precip)
        run: python3 .github/scripts/fetch_raws_snapshot.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add soil/soilmoisture.json soil/coagmet-metadata.json soil/coagmet-daily.json soil/raws-snapshot.json
          git diff --cached --quiet || git commit -m "chore: update CoAgMET soil moisture, RAWS snapshot, and station metadata"
          git push
